version: "3.9"

services:
  bot:
    build: .
    container_name: hooty-bot
    env_file:
      - .env
    volumes:
      - ./src:/app/src  # Maps your src folder to the container
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

